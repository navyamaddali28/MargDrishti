
<!DOCTYPE html>
<html>
<head>
    <title>MargDrishti - Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5eee6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 4px 20px #00000015;
        }

        h2 {
            color: #526b58;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #526b58;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>MargDrishti</h2>

        <p>Enter your registered Admin email to receive a password reset link.</p>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
            required
        >

        <button id="sendButton" onclick="sendResetEmail()">
            Send Reset Link
        </button>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlbduxtgfcbnhylnxjgq.supabase.co";

        const SUPABASE_KEY = "sb_publishable_m3FfU-LwadYCoRipszK81g_GFW6a4ja";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function sendResetEmail() {
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message");
            const button = document.getElementById("sendButton");

            if (!email) {
                message.textContent = "Please enter your email address.";
                message.style.color = "red";
                return;
            }

            button.disabled = true;
            message.textContent = "Sending reset link...";
            message.style.color = "#526b58";

            try {
                const { error } = await client.auth.resetPasswordForEmail(email, {
                    redirectTo: "http://localhost:8000/password_reset/reset_password.html"
                });

                if (error) {
                    throw error;
                }

                message.textContent =
                    "If an account exists for this email, a reset link has been sent.";

                message.style.color = "green";

            } catch (error) {
                message.textContent = error.message;
                message.style.color = "red";

            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
