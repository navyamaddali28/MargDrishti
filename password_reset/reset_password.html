
<!DOCTYPE html>
<html>
<head>
    <title>MargDrishti - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5eee6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 4px 20px #00000015;
        }

        h2 {
            color: #526b58;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #526b58;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>MargDrishti</h2>
        <p>Set a new password for your Admin account.</p>

        <input type="password" id="password" placeholder="New password">
        <input type="password" id="confirmPassword" placeholder="Confirm new password">

        <button id="resetButton" onclick="resetPassword()">
            Update Password
        </button>

        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://hlbduxtgfcbnhylnxjgq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_m3FfU-LwadYCoRipszK81g_GFW6a4ja";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function resetPassword() {
            const message = document.getElementById("message");
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                message.textContent = "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            const button = document.getElementById("resetButton");
            button.disabled = true;
            message.textContent = "Updating password...";

            try {
                const { data, error } = await client.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                message.textContent = "Password updated successfully! You can now log in to MargDrishti.";
                message.style.color = "green";
            } catch (error) {
                message.textContent = error.message;
                message.style.color = "red";
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
